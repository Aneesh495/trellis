[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trellis-sdk"
version = "1.0.0"
description = "Python SDK, DataFrame interop, and WebSocket client for Trellis reactive calculation kernel"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Aneesh Krishna" }
]
keywords = ["spreadsheet", "reactive", "compiler", "crdt", "dataframe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5.0"]
polars = ["polars>=0.18.0"]
test = ["pytest>=7.0.0"]
